<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Module Test</title>
</head>
<body>
    <div id="status">Loading modules...</div>
    
    <script>
        console.log('🔒 Isolated test environment starting...');
        
        // Load modules in isolation
        async function loadModules() {
            try {
                // Load modules one by one
                await loadScript('../src/modules/recommendations/ResponseAnalyzer.js');
                await loadScript('../src/modules/recommendations/RecommendationEngine.js');
                await loadScript('../src/modules/content/ContentManager.js');
                await loadScript('../src/modules/profiles/UserProfileManager.js');
                await loadScript('../src/modules/profiles/GoalTracker.js');
                await loadScript('../src/modules/recommendations/EnhancedResponseAnalyzer.js');
                await loadScript('../src/modules/content/EnhancedContentManager.js');
                await loadScript('../src/modules/recommendations/EnhancedRecommendationsManager.js');
                
                console.log('✅ All modules loaded in isolation');
                document.getElementById('status').textContent = 'Modules loaded successfully!';
                
                // Notify parent window
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'modulesLoaded', success: true }, '*');
                }
                
            } catch (error) {
                console.error('❌ Failed to load modules in isolation:', error);
                document.getElementById('status').textContent = 'Failed to load modules';
                
                // Notify parent window
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ type: 'modulesLoaded', success: false, error: error.message }, '*');
                }
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    console.log(`Script loaded: ${src}`);
                    resolve();
                };
                script.onerror = (error) => {
                    console.error(`Failed to load script: ${src}`, error);
                    reject(error);
                };
                document.head.appendChild(script);
            });
        }
        
        // Start loading when page is ready
        document.addEventListener('DOMContentLoaded', loadModules);
    </script>
</body>
</html>
