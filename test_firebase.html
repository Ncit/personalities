<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
</head>
<body>
    <h1>Firebase Analytics & Crashlytics Test</h1>
    <p>This page tests Firebase integration for the MBTI Quiz app.</p>
    
    <button onclick="testAnalytics()">Test Analytics Event</button>
    <button onclick="testError()">Test Error Logging</button>
    <button onclick="testPageView()">Test Page View</button>
    
    <div id="status"></div>

    <!-- Firebase Analytics -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAnalytics, logEvent } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js';
        import { getPerformance } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-performance.js';

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB773kQHk-jLJeSwYhCluXXk1r6CEOuR8A",
            authDomain: "nikitaproject-b0a52.firebaseapp.com",
            projectId: "nikitaproject-b0a52",
            storageBucket: "nikitaproject-b0a52.firebasestorage.app",
            messagingSenderId: "188919966813",
            appId: "1:188919966813:web:748cc6a6354d672173f1b4",
            measurementId: "G-TZ5LN0BB9L"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        
        // Initialize Analytics
        let analytics = null;
        try {
            analytics = getAnalytics(app);
            console.log('Firebase Analytics initialized successfully');
            document.getElementById('status').innerHTML += '<p style="color: green;">✅ Analytics initialized</p>';
        } catch (error) {
            console.warn('Firebase Analytics initialization failed:', error);
            document.getElementById('status').innerHTML += '<p style="color: red;">❌ Analytics failed: ' + error.message + '</p>';
        }

        // Initialize Performance Monitoring
        let performance = null;
        try {
            performance = getPerformance(app);
            console.log('Firebase Performance initialized successfully');
            document.getElementById('status').innerHTML += '<p style="color: green;">✅ Performance initialized</p>';
        } catch (error) {
            console.warn('Firebase Performance initialization failed:', error);
            document.getElementById('status').innerHTML += '<p style="color: red;">❌ Performance failed: ' + error.message + '</p>';
        }

        // Make Firebase available globally
        window.firebaseAnalytics = {
            logEvent: (eventName, parameters = {}) => {
                if (analytics) {
                    try {
                        logEvent(analytics, eventName, parameters);
                        console.log('Analytics event logged:', eventName, parameters);
                        document.getElementById('status').innerHTML += '<p style="color: blue;">📊 Event logged: ' + eventName + '</p>';
                        return true;
                    } catch (error) {
                        console.warn('Failed to log analytics event:', error);
                        document.getElementById('status').innerHTML += '<p style="color: red;">❌ Event failed: ' + error.message + '</p>';
                        return false;
                    }
                } else {
                    document.getElementById('status').innerHTML += '<p style="color: orange;">⚠️ Analytics not available</p>';
                    return false;
                }
            }
        };

        // Log page view
        if (analytics) {
            logEvent(analytics, 'page_view', {
                page_title: document.title,
                page_location: window.location.href
            });
            document.getElementById('status').innerHTML += '<p style="color: green;">📄 Page view logged</p>';
        }

        // Global error handler for Crashlytics simulation
        window.addEventListener('error', (event) => {
            window.firebaseAnalytics.logEvent('app_error', {
                error_message: event.error?.message || 'Unknown error',
                error_stack: event.error?.stack,
                error_type: 'javascript_error',
                error_filename: event.filename,
                error_lineno: event.lineno
            });
        });

        // Handle unhandled promise rejections
        window.addEventListener('unhandledrejection', (event) => {
            window.firebaseAnalytics.logEvent('app_error', {
                error_message: event.reason?.message || 'Unhandled promise rejection',
                error_stack: event.reason?.stack,
                error_type: 'unhandled_promise_rejection'
            });
        });
    </script>

    <script>
        function testAnalytics() {
            const success = window.firebaseAnalytics.logEvent('test_button_click', {
                button_name: 'test_analytics',
                timestamp: new Date().toISOString()
            });
            
            if (success) {
                alert('Analytics event logged successfully!');
            } else {
                alert('Failed to log analytics event.');
            }
        }

        function testError() {
            // Simulate an error
            try {
                throw new Error('Test error for Firebase Crashlytics');
            } catch (error) {
                window.firebaseAnalytics.logEvent('app_error', {
                    error_message: error.message,
                    error_stack: error.stack,
                    error_type: 'test_error'
                });
                alert('Test error logged to Firebase!');
            }
        }

        function testPageView() {
            const success = window.firebaseAnalytics.logEvent('page_view', {
                page_title: 'Firebase Test Page',
                page_location: window.location.href,
                custom_parameter: 'test_value'
            });
            
            if (success) {
                alert('Page view event logged successfully!');
            } else {
                alert('Failed to log page view event.');
            }
        }
    </script>
</body>
</html>
