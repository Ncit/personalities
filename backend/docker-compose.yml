version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mbti-quiz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-mbti_quiz_db}
      MYSQL_USER: ${DB_USER:-mbti_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mbti_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - mbti-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API Server
  backend:
    build: .
    container_name: mbti-quiz-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-mbti_user}
      - DB_PASSWORD=${DB_PASSWORD:-mbti_password}
      - DB_NAME=${DB_NAME:-mbti_quiz_db}
      - DB_PORT=3306
      - VK_APP_ID=${VK_APP_ID}
      - VK_SECURE_KEY=${VK_SECURE_KEY}
      - VK_API_VERSION=${VK_API_VERSION:-5.131}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - PREMIUM_PRICE=${PREMIUM_PRICE:-50}
      - PREMIUM_DURATION_DAYS=${PREMIUM_DURATION_DAYS:-30}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mbti-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: mbti-quiz-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - mbti-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local

networks:
  mbti-network:
    driver: bridge 