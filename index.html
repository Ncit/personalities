<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>if(location.pathname.startsWith('/personadev')){document.write('<base href="/personadev/">')}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Quiz - 16 Character Types</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/styles/design-system.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/responsive.css">
    <link rel="stylesheet" href="src/styles/screens/home.css">
    <link rel="stylesheet" href="src/styles/screens/explore.css">
    <link rel="stylesheet" href="src/styles/screens/profile.css">
    <link rel="stylesheet" href="src/styles/screens/quiz.css">
    <link rel="stylesheet" href="src/styles/screens/results-timeline.css">
    <link rel="stylesheet" href="src/styles/screens/result-detail.css">
    <link rel="stylesheet" href="src/styles/screens/framework-info.css">
    <link rel="stylesheet" href="src/styles/screens/premium-modal.css">
    <link rel="stylesheet" href="src/styles/screens/type-detail-modal.css">
    <link rel="stylesheet" href="src/styles/screens/help-modal.css">
    <link rel="stylesheet" href="src/modules/vk/vk-styles.css">
    <link rel="stylesheet" href="src/modules/tg/tg-styles.css">
    <!-- Google Fonts with fallback for SSL errors -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" onerror="handleFontError()">
    <!-- Font Awesome removed — using Lucide icons now -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->

    <script>
        function handleFontError() {
            // Fallback font loading if Google Fonts fails
            console.warn('Google Fonts failed to load, using system fonts');

            // Apply fallback font stack
            document.documentElement.style.setProperty('--font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
        }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div id="app">
      <div id="screen-container"></div>
      <nav id="tab-bar" class="tab-bar"></nav>
    </div>
    <div id="overlay-container"></div>
    <div id="toast-container"></div>

    <!-- VK Bridge SDK -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
    <!-- VK Auth SDK -->
    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Environment detection (legacy — PlatformDetector used in modules) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isVKFlavor = urlParams.get('flavor') === 'vk';
        const isTGFlavor = urlParams.get('flavor') === 'tg' || !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
    </script>

    <!-- Debug Utilities -->
    <script type="module" src="src/debug/debug-utils.js"></script>

    <!-- Main app entry -->
    <script type="module" src="script.js"></script>
</body>
</html>
