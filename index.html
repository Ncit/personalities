<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест личности - 16 типов характера</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- old styles.css replaced by design-system CSS imported via App.js -->
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="src/modules/vk/vk-styles.css">
    <!-- Google Fonts with fallback for SSL errors -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" onerror="handleFontError()">
    <!-- Font Awesome removed — using Lucide icons now -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> -->

    <script>
        function handleFontError() {
            // Fallback font loading if Google Fonts fails
            console.warn('Google Fonts failed to load, using system fonts');

            // Apply fallback font stack
            document.documentElement.style.setProperty('--font-family', 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif');
        }
    </script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div id="app">
      <div id="screen-container"></div>
      <nav id="tab-bar" class="tab-bar"></nav>
    </div>
    <div id="overlay-container"></div>
    <div id="toast-container"></div>

    <!-- VK Auth SDK -->
    <script src="https://unpkg.com/@vkid/sdk@<3.0.0/dist-sdk/umd/index.js"></script>

    <!-- Environment detection -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isVKFlavor = urlParams.get('flavor') === 'vk';
    </script>

    <!-- Debug Utilities -->
    <script type="module" src="src/debug/debug-utils.js"></script>

    <!-- Main app entry -->
    <script type="module" src="script.js"></script>
</body>
</html>
