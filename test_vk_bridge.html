<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Bridge Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5a67d8;
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>VK Bridge Integration Test</h1>
    
    <div class="test-section info">
        <h3>Test Information</h3>
        <p>This page tests the VK Bridge integration. Open the browser console to see detailed logs.</p>
        <p><strong>Current Environment:</strong> <span id="environment">Detecting...</span></p>
    </div>

    <div class="test-section">
        <h3>VK Bridge Status</h3>
        <div id="bridgeStatus">Checking...</div>
    </div>

    <div class="test-section">
        <h3>Test Functions</h3>
        <button onclick="testShare()">Test Share</button>
        <button onclick="testNotification()">Test Notification</button>
        <button onclick="testUserInfo()">Test User Info</button>
        <button onclick="testOrderBox()">Test Order Box</button>
        <button onclick="testBannerAd()">Test Banner Ad</button>
        <button onclick="testHideBannerAd()">Test Hide Banner Ad</button>
        <button onclick="testInterstitialAd()">Test Interstitial Ad</button>
        <button onclick="testRewardedAd()">Test Rewarded Ad</button>
    </div>

    <div class="test-section">
        <h3>Console Log</h3>
        <div id="consoleLog" class="log"></div>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <!-- VK Bridge Integration -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
    <script type="module">
        import { VKBridgeManager } from './src/modules/vk/VKBridgeManager.js';
        

        // Override console.log to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const logContainer = document.getElementById('consoleLog');

        function addToLog(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.style.color = type === 'error' ? 'red' : 'black';
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Override console.log to also add to our log container
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleInfo = console.info;
        const originalConsoleDebug = console.debug;

        console.log = function(message, data) {
            originalConsoleLog.call(this, message, data);
            addToLog(message);
        };

        console.error = function(message, data) {
            originalConsoleError.call(this, message, data);
            addToLog(message, 'error');
        };

        console.info = function(message, data) {
            originalConsoleInfo.call(this, message, data);
            addToLog(message);
        };

        console.debug = function(message, data) {
            originalConsoleDebug.call(this, message, data);
            addToLog(message);
        };

        // Initialize VK Bridge Manager
        let vkBridgeManager;
        
        try {
            vkBridgeManager = new VKBridgeManager();
            window.vkBridgeManager = vkBridgeManager;
            
            // Update status
            document.getElementById('bridgeStatus').innerHTML = `
                <div class="success">
                    ✅ VK Bridge Manager initialized successfully<br>
                    VK Platform: ${vkBridgeManager.isVKEnvironment() ? 'Yes' : 'No'}<br>
                    Bridge Available: ${typeof window.vkBridge !== 'undefined' ? 'Yes' : 'No'}
                </div>
            `;
            
            document.getElementById('environment').textContent = 
                vkBridgeManager.isVKEnvironment() ? 'VK Mini App' : 'Standalone Browser';
                
        } catch (error) {
            document.getElementById('bridgeStatus').innerHTML = `
                <div class="error">
                    ❌ Failed to initialize VK Bridge Manager<br>
                    Error: ${error.message}
                </div>
            `;
            document.getElementById('environment').textContent = 'Error';
        }

        // Test functions
        window.testShare = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    await vkBridgeManager.shareResults('INTJ', 'Test share message');
                    console.log('Share test completed');
                } else {
                    console.log('VK Bridge not available for sharing');
                }
            } catch (error) {
                console.error('Share test failed:', error);
            }
        };

        window.testNotification = async function() {
            try {
                if (vkBridgeManager) {
                    await vkBridgeManager.showNotification('Test notification from VK Bridge!');
                    console.log('Notification test completed');
                } else {
                    console.log('VK Bridge not available for notifications');
                }
            } catch (error) {
                console.error('Notification test failed:', error);
            }
        };

        window.testUserInfo = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    const userInfo = await vkBridgeManager.getUserInfo();
                    console.log('User info:', userInfo);
                } else {
                    console.log('VK Bridge not available for user info');
                }
            } catch (error) {
                console.error('User info test failed:', error);
            }
        };

        window.testOrderBox = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    await vkBridgeManager.showOrderBox();
                    console.log('Order box test completed');
                } else {
                    console.log('VK Bridge not available for order box');
                }
            } catch (error) {
                console.error('Order box test failed:', error);
            }
        };

        window.testBannerAd = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    const result = await vkBridgeManager.showBannerAd();
                    console.log('Banner ad test completed:', result);
                } else {
                    console.log('VK Bridge not available for banner ads');
                }
            } catch (error) {
                console.error('Banner ad test failed:', error);
            }
        };

        window.testHideBannerAd = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    const result = await vkBridgeManager.hideBannerAd();
                    console.log('Hide banner ad test completed:', result);
                } else {
                    console.log('VK Bridge not available for hiding banner ads');
                }
            } catch (error) {
                console.error('Hide banner ad test failed:', error);
            }
        };

        window.testInterstitialAd = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    const result = await vkBridgeManager.showInterstitialAd();
                    console.log('Interstitial ad test completed:', result);
                } else {
                    console.log('VK Bridge not available for interstitial ads');
                }
            } catch (error) {
                console.error('Interstitial ad test failed:', error);
            }
        };

        window.testRewardedAd = async function() {
            try {
                if (vkBridgeManager && vkBridgeManager.isVKEnvironment()) {
                    const result = await vkBridgeManager.showRewardedAd();
                    console.log('Rewarded ad test completed:', result);
                } else {
                    console.log('VK Bridge not available for rewarded ads');
                }
            } catch (error) {
                console.error('Rewarded ad test failed:', error);
            }
        };

        window.clearLog = function() {
            logContainer.innerHTML = '';
        };

        console.log('VK Bridge test page loaded');
    </script>
</body>
</html>
